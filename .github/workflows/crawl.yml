name: crawl
on:
  workflow_dispatch:
    inputs:
      batch_pages:
        description: "Pages per run"
        default: "400"
      extra:
        description: "Extra options for the script"
        default: ""
      fresh:
        description: "Start again (ignore saved progress)"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Restore progress
        if: ${{ !inputs.fresh }}
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Reachability check
        run: |
          curl -s -o /dev/null -w "www: %{http_code}\n" -m 30 -A "Mozilla/5.0 (Macintosh) Chrome/131" https://www.tatacapital.com/ || echo "www: unreachable"
      - name: Crawl
        env:
          BATCH: ${{ inputs.batch_pages }}
          EXTRA: ${{ inputs.extra }}
        run: |
          mkdir -p state out
          cp state/pages.jsonl out/ 2>/dev/null || true
          cp state/sitemap_urls.txt out/ 2>/dev/null || true
          python tc_site_inventory.py --out out --batch-pages "$BATCH" --time-limit 300 $EXTRA || true
          cp out/pages.jsonl state/ 2>/dev/null || true
          cp out/sitemap_urls.txt state/ 2>/dev/null || true
          cat out/status.json || true
      - name: Save progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}
      - name: Push batch to its own branch
        if: always()
        run: |
          cd out
          git init -q -b "batch-${{ github.run_number }}"
          git config user.name "crawler"; git config user.email "crawler@users.noreply.github.com"
          git add -A && git commit -q -m "Batch ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "batch-${{ github.run_number }}"
      - name: Start the next batch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH: ${{ inputs.batch_pages }}
          EXTRA: ${{ inputs.extra }}
        run: |
          NEXT=$(python3 -c "import json;s=json.load(open('out/status.json'));print('yes' if (not s['finished'] and s['pages_this_run']>0) else 'no')" 2>/dev/null || echo no)
          echo "next: $NEXT"
          if [ "$NEXT" = yes ]; then
            gh workflow run crawl.yml -R "${{ github.repository }}" --ref main -f batch_pages="$BATCH" -f extra="$EXTRA" -f fresh=false
          fi
